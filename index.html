<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מאגרי יועצים | ירושלים</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#173142;font:16px system-ui,sans-serif}header{background:#173c50;color:white;padding:36px max(24px,calc((100% - 1000px)/2))}header p{color:#d4e6ec}main{max-width:1000px;margin:auto;padding:30px 24px}h1{margin:0;font-size:32px}.notice{background:#fff7e2;border-right:4px solid #d69a29;padding:15px;line-height:1.7;border-radius:6px}input{width:100%;padding:15px;border:1px solid #aebfc8;border-radius:8px;font:inherit;margin:22px 0}article{background:white;border:1px solid #dce4e8;border-radius:10px;padding:20px;margin:12px 0}article h2{font-size:19px;margin:0 0 8px}article p{color:#526876;margin:6px 0}a{color:#006d86;font-weight:600}.count{color:#526876}</style></head><body><header><h1>מאגרי יועצים וספקים</h1><p>חיפוש בפרסומי עיריית ירושלים</p></header><main><div class="notice"><strong>גרסת התחלה מקומית.</strong> מוצגים פרטי פרסומים בלבד; רשימות הספקים טרם נקלטו ואומתו. תאריך העדכון אינו מעיד על תוקף התקשרות.</div><label for="search">חיפוש לפי מאגר, מינהל או אגף</label><input id="search" type="search" placeholder="לדוגמה: תחבורה או מחשוב"><div id="count" class="count" aria-live="polite"></div><section id="results"></section></main><script>
const search=document.querySelector('#search'),results=document.querySelector('#results'),count=document.querySelector('#count');let seq=0;async function render(){const id=++seq;const response=await fetch('/api/registries?q='+encodeURIComponent(search.value));const rows=await response.json();if(id!==seq)return;results.replaceChildren();count.textContent=rows.length+' פרסומים';for(const r of rows){let card=document.createElement('article'),title=document.createElement('h2'),info=document.createElement('p'),date=document.createElement('p'),link=document.createElement('a');title.textContent=r.name;info.textContent=[r.administration,r.department].filter(Boolean).join(' · ');date.textContent='תאריך עדכון הפרסום: '+(r.published_on?r.published_on.split('-').reverse().join('.'):'לא צוין');link.href=r.source_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='פתיחת מסמך המקור';card.append(title,info,date,link);results.append(card)}}search.addEventListener('input',render);render().catch(()=>count.textContent='לא ניתן לטעון את הנתונים');</script></body></html>

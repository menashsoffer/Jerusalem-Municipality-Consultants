name: Setup workspace
description: Node from .nvmrc and a frozen npm install without lifecycle scripts. No dependency cache (cache poisoning, documentation/factory/security.md).
inputs:
  install:
    description: Run npm ci --ignore-scripts.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - if: inputs.install == 'true'
      shell: bash
      run: npm ci --ignore-scripts

name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.9 coverage==7.17.3 -r requirements-scripts.txt
      - run: ruff format --check .
      - run: ruff check .
      # Fails below the fail_under value in pyproject.toml.
      - run: python -m coverage run -m unittest discover -s tests -t . -v
      - run: python -m coverage report

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run types:db:check
      # Runs every TypeScript test and fails below the thresholds in scripts/coverage/scope.json.
      - run: npm run coverage
      - run: npm run size:check

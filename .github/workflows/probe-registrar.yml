name: probe-registrar
# Temporary (Menash approved 25.11): prints the field names of public registrar datasets on
# data.gov.il, which the cloud workspace cannot reach. Removed right after it runs.
on:
  push:
    branches: [claude/project-thread-dqsz2r]
    paths: [.github/workflows/probe-registrar.yml]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          base='https://data.gov.il/api/3/action/datastore_search?resource_id='
          for r in be5b7935-3922-45d4-9638-08871b17ec95 cb12ac14-7429-4268-bc03-460f48157858 \
            28780ab5-3ef1-44c7-8377-da82c0aa6781 f004176c-b85f-4542-8901-7b3176f9a054 \
            139aa193-fabb-4f6b-a71b-0bb40fd73eb2 cad6bb66-5560-4cf4-a39c-92518f3f18ef; do
            echo "=== $r"
            curl -s -m 60 "${base}${r}&limit=3" \
              | jq -c '{total: .result.total, fields: [.result.fields[] | [.id, .type]], records: .result.records}'
          done

name: CI

# The `ci` job is a required check of the main ruleset, with `pipeline/gates`.
# Deterministic gate in front of every AI step: nothing an agent writes
# reaches review or a human until this is green.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pipeline-pr-${{ github.event.pull_request.number || github.run_id }}-ci
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Format, lint, typecheck, database types, coverage, web build and bundle size.
      - name: Project checks
        run: npm run check

      - name: Pipeline script tests
        run: npm run test:pipeline

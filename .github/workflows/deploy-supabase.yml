# Applies migrations and Edge Functions (decisions 0002 and 0003).
# Staging runs on every merge to main. Production runs only when started by hand
# ("Run workflow"), shows the pending migrations, and then waits for the owner's approval
# in the production environment.
name: deploy-supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/seed/**'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
    inputs:
      production:
        description: 'Also deploy to production after staging (asks for approval)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    outputs:
      applied: ${{ steps.config.outputs.ready }}
    steps:
      - name: Check that staging is configured
        id: config
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Staging project is not configured yet; nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SUPABASE_PROJECT_REF" = "${{ vars.PRODUCTION_PROJECT_REF }}" ]; then
            echo "The staging environment points at the production project." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.config.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations and dummy data
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --include-seed --yes
      - if: steps.config.outputs.ready == 'true'
        run: scripts/deploy/deploy-functions.sh

  production-plan:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.production &&
      needs.staging.outputs.applied == 'true'
    needs: staging
    runs-on: ubuntu-latest
    environment: production-plan
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: List what production would receive
        run: |
          supabase db push --dry-run 2>&1 | tee plan.txt
          { echo '### Pending for production'; echo '```'; cat plan.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: production-plan
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations (no dummy data)
        run: supabase db push --yes
      - run: scripts/deploy/deploy-functions.sh
